<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURAM - Premium Retail Experience</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>

    <style>
        :root { 
            --accent: #00d4ff; 
            --bg: #000; 
            --panel-bg: rgba(0, 0, 0, 0.4); 
            --glow: 0 0 20px rgba(0,212,255,0.6); 
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: white; font-family: 'Helvetica Neue', Helvetica, sans-serif; overflow: hidden; }
        
        #mirror-container { position: relative; width: 100vw; height: 100vh; }
        #webcam { display: none; }
        #canvasMirror { width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }
        #vto-result-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 5; display: none; }

        /* Interfaz de Usuario */
        #ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; z-index: 10; transition: opacity 0.5s ease; }
        
        h1 { text-align: center; letter-spacing: 15px; font-weight: 200; margin-top: 35px; font-size: 45px; text-shadow: var(--glow); }

        /* Panel Glassmorphism (Traslúcido) */
        #response-panel { 
            background: var(--panel-bg); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 35px; margin: 0 50px; border-radius: 35px; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            pointer-events: auto; min-height: 200px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .auram-response-container { display: flex; align-items: center; justify-content: space-between; gap: 30px; }
        .auram-text-col { flex: 2.2; font-size: 22px; line-height: 1.6; font-weight: 300; }
        .auram-thumb-col { flex: 0.8; display: flex; flex-direction: column; align-items: center; background: rgba(255,255,255,0.08); padding: 15px; border-radius: 25px; border: 1px solid var(--accent); }
        .thumb-image { width: 140px; height: 140px; object-fit: contain; filter: drop-shadow(var(--glow)); }

        #vto-controls { display: none; gap: 25px; justify-content: center; margin-top: 25px; }
        #controls-footer { padding: 45px; display: flex; gap: 25px; justify-content: center; pointer-events: auto; }
        
        button { padding: 22px 55px; font-size: 22px; font-weight: bold; border: none; border-radius: 60px; background: linear-gradient(45deg, var(--accent), #0046ff); color: white; cursor: pointer; transition: transform 0.2s; box-shadow: var(--glow); }
        button:active { transform: scale(0.96); }
        button.btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid white; backdrop-filter: blur(5px); }

        /* Guía de Posición y Flash */
        #guia-hombros { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); width: 55%; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 12; fill: none; opacity: 0.7; display: none; z-index: 95; }
        #camera-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; z-index: 1000; pointer-events: none; }
        .flash-active { animation: flashAnim 0.4s ease-out; }
        @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }

        /* Countdown */
        #countdown-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); backdrop-filter: blur(5px); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #count-number { font-size: 200px; color: var(--accent); text-shadow: var(--glow); font-weight: bold; }

        /* Botones después de la foto */
        #post-photo-actions { display: none; gap: 25px; position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); z-index: 20; pointer-events: auto; }
    </style>
</head>
<body>

<div id="mirror-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvasMirror"></canvas>
    <canvas id="vto-result-canvas"></canvas>
    <div id="camera-flash"></div>

    <svg id="guia-hombros" viewBox="0 0 200 100">
        <path d="M40,80 Q40,40 70,40 L130,40 Q160,40 160,80" />
        <text x="52" y="30" fill="#00d4ff" font-size="9" font-family="sans-serif" font-weight="bold">ALINEA TUS HOMBROS AQUÍ</text>
    </svg>

    <div id="countdown-overlay">
        <div id="count-number">5</div>
    </div>

    <div id="ui-overlay">
        <h1>A U R A M</h1>
        <div id="response-panel">
            <div id="response-text">
                <p style="text-align: center; font-size: 28px; font-weight: 300;">Bienvenido. Permíteme analizar tu estilo para ofrecerte una propuesta exclusiva.</p>
            </div>
            <div id="vto-controls">
                <button onclick="startCountdown()">PROBAR LOOK</button>
                <button class="btn-secondary" onclick="resetAura()">OTRO ANÁLISIS</button>
            </div>
        </div>
        <div id="controls-footer">
            <button id="btn-analyze" onclick="analyzeLook()">INICIAR ANÁLISIS</button>
        </div>
    </div>

    <div id="post-photo-actions">
        <button class="btn-secondary" style="background:#333;" onclick="cancelPhoto()">← REPETIR FOTO</button>
        <button style="background: linear-gradient(45deg, #00ffaa, #008855);" onclick="alert('Generando enlace de pago premium...')">ADQUIRIR PRENDA</button>
    </div>
</div>

<script type="module">
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    const API_KEY = "AIzaSyDj9S4yWKIV1BqkjsjBNVwh7kn91DxzG7I"; 
    const genAI = new GoogleGenerativeAI(API_KEY);
    
    // Configuración del modelo con el Prompt Detallado
    const model = genAI.getGenerativeModel({ 
        model: "gemini-1.5-flash",
        systemInstruction: `Eres AURAM, una sofisticada IA experta en estilismo premium. 
        Analiza el look, complexión y armonía cromática del usuario.
        TU RESPUESTA DEBE:
        1. Elogiar un detalle del estilo actual del usuario.
        2. Justificar detalladamente por qué la prenda sugerida equilibra su silueta y aporta luminosidad a su imagen basándote en colorimetría.
        3. Dar un consejo de combinación profesional.
        4. Evitar menciones directas a rasgos físicos negativos; usa lenguaje aspiracional.
        5. Extensión: 65-85 palabras.
        6. OBLIGATORIO: Terminar con [[ID:n]] donde n es el ID del producto.`
    });

    const inventario = [
        { id: "1", nombre: "Casaca Urbana Eco", url: "https://i.postimg.cc/BvHWx1z8/casaca1.png" }, 
        { id: "2", nombre: "Blazer Minimalist", url: "https://i.postimg.cc/0NDgpJ4b/camisa1.png" }
    ];

    let currentProduct = null;
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvasMirror');
    const ctx = canvas.getContext('2d');
    const responseBox = document.getElementById('response-text');

    async function initCamera() {
        const camera = new Camera(video, {
            onFrame: async () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                ctx.save();
                ctx.scale(-1, 1);
                ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
                ctx.restore();
            }
        });
        camera.start();
    }

    window.analyzeLook = async () => {
        document.getElementById('btn-analyze').style.display = 'none';
        responseBox.innerHTML = "<p style='text-align:center; font-size: 26px;'>AURAM está diseñando tu propuesta de imagen...</p>";
        
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 640; tempCanvas.height = 480;
        tempCanvas.getContext('2d').drawImage(video, 0, 0);
        const imgBase64 = tempCanvas.toDataURL('image/jpeg', 0.6).split(',')[1];

        try {
            const result = await model.generateContent([
                `Realiza una asesoría experta con este inventario: ${JSON.stringify(inventario)}. Termina con [[ID:n]]`,
                { inlineData: { data: imgBase64, mimeType: "image/jpeg" } }
            ]);
            renderResponse(await result.response.text());
        } catch (e) {
            renderResponse("Proyectas una presencia magnífica. Para potenciar tu silueta, he seleccionado esta pieza que aporta una estructura impecable a tus hombros, mientras su tono armoniza con tu luz natural. Una elección versátil para un estilo de vida contemporáneo. [[ID:1]]");
        }
    };

    function renderResponse(texto) {
        let cleanText = texto.replace(/\[\[ID:\d+\]\]/g, "").trim();
        const match = texto.match(/\[\[ID:(\d+)\]\]/);
        currentProduct = match ? inventario.find(p => p.id === match[1]) : inventario[0];

        responseBox.innerHTML = `
            <div class="auram-response-container">
                <div class="auram-text-col">${cleanText}</div>
                <div class="auram-thumb-col">
                    <img src="${currentProduct.url}" class="thumb-image">
                    <span style="font-size:16px; font-weight:bold; color:var(--accent); margin-top:8px;">${currentProduct.nombre}</span>
                </div>
            </div>`;
        document.getElementById('vto-controls').style.display = 'flex';
    }

    window.startCountdown = () => {
        document.getElementById('ui-overlay').style.opacity = "0";
        document.getElementById('countdown-overlay').style.display = 'flex';
        document.getElementById('guia-hombros').style.display = 'block';
        
        let c = 5;
        const i = setInterval(() => {
            c--;
            document.getElementById('count-number').innerText = c;
            if(c === 0) { 
                clearInterval(i);
                document.getElementById('camera-flash').classList.add('flash-active');
                setTimeout(doVTO, 150);
            }
        }, 1000);
    };

    function doVTO() {
        const resCanvas = document.getElementById('vto-result-canvas');
        const rCtx = resCanvas.getContext('2d');
        resCanvas.width = canvas.width; resCanvas.height = canvas.height;

        rCtx.save(); rCtx.scale(-1, 1);
        rCtx.drawImage(video, -resCanvas.width, 0, resCanvas.width, resCanvas.height);
        rCtx.restore();

        const imgP = new Image();
        imgP.crossOrigin = "anonymous";
        imgP.onload = () => {
            const pw = resCanvas.width * 0.65; // Ajuste según guía de hombros
            const ph = (imgP.height * pw) / imgP.width;
            
            rCtx.globalAlpha = 0.96; // Efecto de integración con el fondo
            rCtx.drawImage(imgP, (resCanvas.width - pw)/2, resCanvas.height * 0.22, pw, ph);
            rCtx.globalAlpha = 1.0;

            document.getElementById('camera-flash').classList.remove('flash-active');
            document.getElementById('countdown-overlay').style.display = 'none';
            document.getElementById('guia-hombros').style.display = 'none';
            resCanvas.style.display = 'block';
            document.getElementById('post-photo-actions').style.display = 'flex';
        };
        imgP.src = currentProduct.url;
    }

    window.cancelPhoto = () => {
        document.getElementById('vto-result-canvas').style.display = 'none';
        document.getElementById('post-photo-actions').style.display = 'none';
        document.getElementById('ui-overlay').style.opacity = "1";
    };

    window.resetAura = () => location.reload();

    initCamera();
</script>
</body>
</html>
