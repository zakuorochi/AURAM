<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURAM - Vertical Experience</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>

    <style>
        :root { 
            --accent: #00d4ff;
            --bg: #000; 
            --panel-bg: rgba(0, 0, 0, 0.65); 
            --glow: 0 0 20px rgba(0,212,255,0.6);
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: white; font-family: 'Helvetica Neue', sans-serif; overflow: hidden; }
        #mirror-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #webcam { display: none; }
        #canvasMirror { width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }
        #vto-result-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 5; display: none; }

        /* UI INFERIOR */
        #ui-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; 
            justify-content: flex-end; 
            pointer-events: none; z-index: 10; transition: opacity 0.5s ease; 
        }
        
        h1 { position: absolute; top: 35px; width: 100%; text-align: center; letter-spacing: 15px; font-weight: 200; font-size: 45px; text-shadow: var(--glow); margin: 0; }

        #response-panel { 
            background: var(--panel-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 30px; margin: 0 50px 40px 50px; 
            border-radius: 35px; border: 1px solid rgba(255, 255, 255, 0.15); 
            pointer-events: auto; min-height: 180px; 
        }

        .auram-response-container { display: flex; align-items: center; justify-content: space-between; gap: 30px; }
        .auram-text-col { flex: 2; font-size: 20px; }
        .auram-thumb-col { flex: 1; text-align: center; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 25px; border: 1px solid var(--accent); }
        .thumb-image { width: 100px; height: 100px; object-fit: contain; }

        #vto-controls { display: none; gap: 20px; justify-content: center; margin-top: 20px; }
        #controls-footer { padding-bottom: 20px; display: flex; justify-content: center; pointer-events: auto; }
        
        button { padding: 18px 45px; font-size: 18px; font-weight: bold; border: none; border-radius: 60px; background: linear-gradient(45deg, var(--accent), #0046ff); color: white; cursor: pointer; box-shadow: var(--glow); transition: 0.3s; }
        .btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid white; }

        #camera-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; z-index: 1000; pointer-events: none; }
        .flash-active { animation: flashAnim 0.4s ease-out; }
        @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }

        #post-photo-actions { display: none; gap: 25px; position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); z-index: 20; pointer-events: auto; }
        .weaving-text { animation: pulse 1.5s infinite; color: var(--accent); letter-spacing: 3px; font-weight: bold; text-align: center; font-size: 26px; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<div id="mirror-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvasMirror"></canvas>
    <canvas id="vto-result-canvas"></canvas>
    <div id="camera-flash"></div>

    <div id="ui-overlay">
        <h1>A U R A M</h1>
        <div id="response-panel">
            <div id="response-text">
                <p style="text-align: center; font-size: 24px; font-weight: 200;">Espejo Inteligente de Alta Definición</p>
            </div>
            <div id="vto-controls">
                <button onclick="startCountdown()">TOMAR FOTO</button>
                <button class="btn-secondary" onclick="resetAura()">REINTENTAR</button>
            </div>
        </div>
        <div id="controls-footer">
            <button id="btn-analyze" onclick="analyzeLook()">ANALIZAR ESTILO</button>
        </div>
    </div>

    <div id="post-photo-actions">
        <button class="btn-secondary" onclick="cancelPhoto()">← REINTENTAR</button>
        <button style="background: #00ffaa; color: #000;" onclick="alert('Checkout...')">COMPRAR</button>
    </div>
</div>

<script type="module">
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    const API_KEY = "AIzaSyDj9S4yWKIV1BqkjsjBNVwh7kn91DxzG7I"; 
    const genAI = new GoogleGenerativeAI(API_KEY);
    const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

    const inventario = [
        { id: "1", nombre: "Casaca Urbana Eco", url: "https://i.postimg.cc/BvHWx1z8/casaca1.png" }, 
        { id: "2", nombre: "Blazer Minimalist", url: "https://i.postimg.cc/0NDgpJ4b/camisa1.png" }
    ];

    let currentProduct = null;
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvasMirror');
    const ctx = canvas.getContext('2d');
    const responseBox = document.getElementById('response-text');

    async function initCamera() {
        const camera = new Camera(video, {
            onFrame: async () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                
                ctx.save();
                // 1. Mover al centro del canvas
                ctx.translate(canvas.width / 2, canvas.height / 2);
                
                // 2. ROTACIÓN 90 grados
                ctx.rotate(90 * Math.PI / 180);
                
                // 3. EFECTO ESPEJO (FLIP)
                ctx.scale(-1, 1);
                
                // 4. Dibujar el video cubriendo el área rotada
                // Ajustamos las proporciones para que llene la pantalla vertical
                const aspect = video.videoWidth / video.videoHeight;
                const drawHeight = canvas.width; 
                const drawWidth = drawHeight * aspect;

                ctx.drawImage(video, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
                ctx.restore();
            }
        });
        camera.start();
    }

  // BUSCA LA FUNCIÓN analyzeLook Y ACTUALIZA EL PROMPT INTERNO:

window.analyzeLook = async () => {
    document.getElementById('btn-analyze').style.display = 'none';
    responseBox.innerHTML = "<p style='text-align:center; font-style: italic;'>AURAM percibiendo tu esencia...</p>";
    
    const imgBase64 = canvas.toDataURL('image/jpeg', 0.6).split(',')[1];

    try {
        const result = await model.generateContent([
            `Observa detenidamente a esta persona. Basándote en su presencia, selecciona la pieza ideal de este inventario: ${JSON.stringify(inventario)}. 
            Háblale directamente, con calidez, explicando cómo esta prenda complementa su luz actual.`,
            { inlineData: { data: imgBase64, mimeType: "image/jpeg" } }
        ]);
        renderResponse(await result.response.text());
    } catch (e) {
        renderResponse("Percibo una elegancia atemporal en tu postura. Para elevar esa narrativa, he seleccionado una pieza que aporta estructura y sofisticación a tu presencia. [[ID:1]]");
    }
};

    function renderResponse(texto) {
        let cleanText = texto.replace(/\[\[ID:\d+\]\]/g, "").trim();
        const match = texto.match(/\[\[ID:(\d+)\]\]/);
        currentProduct = match ? inventario.find(p => p.id === match[1]) : inventario[0];
        
        responseBox.innerHTML = `
            <div class="auram-response-container">
                <div class="auram-text-col">${cleanText}</div>
                <div class="auram-thumb-col">
                    <img src="${currentProduct.url}" class="thumb-image">
                    <p style="font-size:12px; color:var(--accent);">${currentProduct.nombre}</p>
                </div>
            </div>`;
        document.getElementById('vto-controls').style.display = 'flex';
    }

    window.startCountdown = () => {
        document.getElementById('ui-overlay').style.opacity = "0";
        let c = 3;
        const i = setInterval(() => {
            if(c === 0) { 
                clearInterval(i);
                document.getElementById('camera-flash').classList.add('flash-active');
                setTimeout(doVTO, 200);
            }
            c--;
        }, 1000);
    };

    function doVTO() {
        responseBox.innerHTML = `<p class="weaving-text">AURAM VISION: GENERANDO RESULTADO...</p>`;
        document.getElementById('ui-overlay').style.opacity = "1";

        const resCanvas = document.getElementById('vto-result-canvas');
        const rCtx = resCanvas.getContext('2d');
        
        const imgResultado = new Image();
        imgResultado.crossOrigin = "anonymous";
        // LINK DE TU FOTO EDITADA (Debe estar rotada también si la editaste fuera)
        imgResultado.src = "https://i.postimg.cc/G3PHdYPM/Gemini-Generated-Image-aa47n0aa47n0aa47.png"; 

        imgResultado.onload = () => {
            resCanvas.width = canvas.width;
            resCanvas.height = canvas.height;
            rCtx.drawImage(imgResultado, 0, 0, resCanvas.width, resCanvas.height);

            setTimeout(() => {
                document.getElementById('ui-overlay').style.opacity = "0"; 
                resCanvas.style.display = 'block';
                document.getElementById('post-photo-actions').style.display = 'flex';
            }, 2500);
        };
    }

    window.cancelPhoto = () => {
        document.getElementById('vto-result-canvas').style.display = 'none';
        document.getElementById('post-photo-actions').style.display = 'none';
        document.getElementById('ui-overlay').style.opacity = "1";
    };

    window.resetAura = () => location.reload();
    initCamera();
</script>
</body>
</html>
